name: CI

on:
  push:
    branches: [main, DEV]
  pull_request:
    branches: [main, DEV]
  workflow_dispatch: {}

jobs:
  unit-tests:
    name: Unit tesztek (tiszta logika, gyors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      - name: Teszt-függőségek telepítése
        run: pip install -r requirements-test.txt

      - name: pytest futtatása
        run: pytest tests/ -v --ignore=tests/fixtures

  docker-integration:
    name: Docker build + élő Kafka pipeline smoke teszt
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Teszt videó előkészítése (kis fixture a teljes klip helyett)
        run: |
          mkdir -p data/video data/highlights
          cp tests/fixtures/sample_clip.mp4 data/video/test_clip_av.mp4

      - name: Image-ek build-elése
        run: docker compose build

      - name: Stack elindítása
        run: docker compose up -d

      - name: Várakozás a modellek betöltésére és az első feldolgozási körre
        run: sleep 75

      - name: Dashboard elérhetőségi teszt
        run: |
          curl -sf -o /dev/null http://localhost:8501 \
            && echo "Dashboard OK (HTTP 200)" \
            || (echo "::error::Dashboard nem válaszol" && exit 1)

      - name: OCR valós adatot termel-e (nfl.metadata)
        run: |
          docker compose logs ocr_service | grep -Eq "PHI|NYG" \
            && echo "OCR OK: valós csapat/eredmény adat a logban" \
            || (echo "::error::Az OCR service nem termelt felismerhető játékhelyzetet" && exit 1)

      - name: Fusion termel-e Win Probability kimenetet (nfl.winprob)
        run: |
          docker compose logs fusion_service | grep -Eq "win prob:" \
            && echo "Fusion OK: win probability számítva" \
            || (echo "::error::A fusion service nem termelt win probability kimenetet" && exit 1)

      - name: Detection termel-e játékos-detekciót (nfl.detections)
        run: |
          docker compose logs detection_service | grep -Eq "játékos" \
            && echo "Detection OK: YOLO detekciók érkeztek" \
            || (echo "::error::A detection service nem termelt detekciós kimenetet" && exit 1)

      - name: Egyetlen konténer sem állt-e le váratlanul
        run: |
          EXITED=$(docker compose ps -a --filter "status=exited" --format '{{.Name}}: {{.Status}}' || true)
          if [ -n "$EXITED" ]; then
            echo "::error::Váratlanul leállt konténer(ek) (mindegyiknek 'Up' állapotban kellene lennie, az ingestion is LOOP=true miatt): $EXITED"
            exit 1
          fi
          echo "Minden szolgáltatás fut."

      - name: Logok kiírása (hiba esetén diagnosztikához)
        if: failure()
        run: docker compose logs

      - name: Leállítás és takarítás
        if: always()
        run: docker compose down -v
