# Minden Python szolgáltatás ugyanazt a Dockerfile-t/tartalmat építi -
# az x-app horgony (anchor) biztosítja, hogy egyetlen közös image ("nflapp-app")
# épüljön fel egyszer, és minden szolgáltatás azt használja újra (más command-dal
# indítva). Enélkül a docker-compose 6 KÜLÖN, egyenként ~4GB-os image-et
# építene (torch/easyocr/ultralytics minden image-ben duplikálva) - ez kb.
# 24GB felesleges lemezterületet jelentett, és CI futtatókon (jellemzően
# ~14GB szabad hely) el is fogyaszthatta volna a rendelkezésre álló helyet.
x-app: &app
  build: .
  image: nflapp-app:latest
  restart: unless-stopped
  environment: &app-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  depends_on:
    - kafka

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: nflapp-kafka
    restart: unless-stopped
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  ingestion:
    <<: *app
    container_name: nflapp-ingestion
    command: python ingestion_service.py
    environment:
      <<: *app-env
      VIDEO_PATH: /app/data/video/test_clip_av.mp4
      PLAYBACK_SPEED: "4.0"
      LOOP: "true"
    volumes:
      - ./data:/app/data

  ocr_service:
    <<: *app
    container_name: nflapp-ocr
    command: python ocr_service.py

  detection_service:
    <<: *app
    container_name: nflapp-detection
    command: python detection_service.py
    environment:
      <<: *app-env
      AWAY_TEAM: PHI
      HOME_TEAM: NYG
      POSTEAM: NYG
      DETECTION_STRIDE: "3"

  fusion_service:
    <<: *app
    container_name: nflapp-fusion
    command: python fusion_service.py

  highlight_service:
    <<: *app
    container_name: nflapp-highlight
    command: python highlight_service.py
    environment:
      <<: *app-env
      VIDEO_PATH: /app/data/video/test_clip_av.mp4
    volumes:
      - ./data:/app/data

  dashboard:
    <<: *app
    container_name: nflapp-dashboard
    command: streamlit run dashboard_service.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
